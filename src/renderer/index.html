<!DOCTYPE html>
<!--
  All Craft Launcher 渲染进程唯一入口（docs/UI-SPEC.md §8）
  职责：提供应用外壳骨架（标题栏/页面容器/浮动按钮/弹窗层/toast 层），
  样式与逻辑分别由 css/** 与 js/** 承担；全部资源为本地原创，零外部依赖。
-->
<html lang="zh-CN" data-theme="light" data-accent="blue">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- 内容安全策略：仅允许本地资源；style/script 的 unsafe-inline 仅为兼容首屏防闪白的
       内联主题缓存脚本与内联样式，业务代码全部走本地文件（无 eval、无远程脚本） -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'">
  <title>All Craft Launcher</title>

  <!-- 首屏关键样式：在 CSS 加载前按主题给页面底色，避免闪白 -->
  <style>
    html { background: #141A24; }
    html[data-theme="light"] { background: #E9EDF4; }
    body { margin: 0; overflow: hidden; }
  </style>

  <!-- 主题缓存：JS 模块加载前先应用上次的主题/主题色，切换无闪白 -->
  <script>
    (function () {
      try {
        var c = JSON.parse(localStorage.getItem('acl.ui.cache') || '{}');
        document.documentElement.setAttribute('data-theme', c.theme === 'dark' ? 'dark' : 'light');
        document.documentElement.setAttribute('data-accent', c.accent || 'blue');
      } catch (e) { /* 缓存损坏时保持默认浅色 */ }
    })();
  </script>

  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages/home.css">
  <link rel="stylesheet" href="css/pages/download.css">
  <link rel="stylesheet" href="css/pages/settings.css">
  <link rel="stylesheet" href="css/pages/about.css">
</head>
<body>
  <!-- 应用外壳：标题栏 + 页面容器 + 浮动层 -->
  <div id="app" class="acl-app">
    <!-- 自绘标题栏（44px，拖动区），内容由 js/app.js 构建 -->
    <header id="acl-titlebar" class="acl-titlebar"></header>
    <!-- 页面容器：hash 路由按页面模块渲染 -->
    <main id="acl-main" class="acl-main"></main>
    <!-- 右下任务面板弹层（默认隐藏） -->
    <aside id="acl-task-panel" class="acl-task-panel is-hidden" aria-hidden="true"></aside>
    <!-- 右下浮动按钮组 -->
    <div id="acl-fabs" class="acl-fabs"></div>
    <!-- 模态框层 -->
    <div id="acl-modal-layer"></div>
    <!-- toast 通知层 -->
    <div id="acl-toast-layer" class="acl-toast-layer"></div>
  </div>

  <!-- 应用引导（ES 模块，零构建） -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
